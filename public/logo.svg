<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12182b"/>
      <stop offset="100%" stop-color="#090d18"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4cd7f6" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Primary 'S' Ribbon Gradient -->
    <linearGradient id="s-ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#4cd7f6"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Slot Accent Gradient -->
    <linearGradient id="slot-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4cd7f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Glass Card Container -->
  <rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5"/>

  <!-- Calendar Track / Header Pill -->
  <rect x="8" y="7" width="28" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.12"/>
  
  <!-- Calendar Binder / Clock Nodes -->
  <circle cx="14" cy="8.5" r="1.5" fill="#4cd7f6"/>
  <circle cx="22" cy="8.5" r="1.5" fill="#818cf8"/>
  <circle cx="30" cy="8.5" r="1.5" fill="#4cd7f6"/>

  <!-- Futuristic Kinetic 'S' formed by Connected Time Slots -->
  <!-- Top Slot Block -->
  <path d="M 29 15 C 29 13.9 28.1 13 27 13 L 17 13 C 14.2 13 12 15.2 12 18 C 12 20.8 14.2 23 17 23 L 27 23 C 29.8 23 32 25.2 32 28 C 32 30.8 29.8 33 27 33 L 16 33 C 14.9 33 14 32.1 14 31" 
        stroke="url(#s-ribbon)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#neon-glow)"/>

  <!-- Top Active Slot Indicator (Clockwise tick) -->
  <rect x="23" y="16.5" width="8" height="3" rx="1.5" fill="#4cd7f6" fill-opacity="0.75"/>

  <!-- Bottom Active Slot Indicator -->
  <rect x="13" y="26.5" width="8" height="3" rx="1.5" fill="#818cf8" fill-opacity="0.75"/>

  <!-- Central Chrono Synchronizer Spark / AI Core -->
  <circle cx="22" cy="23" r="2" fill="#ffffff"/>
  <circle cx="22" cy="23" r="3.5" stroke="#4cd7f6" stroke-width="1" stroke-opacity="0.9"/>
</svg>
